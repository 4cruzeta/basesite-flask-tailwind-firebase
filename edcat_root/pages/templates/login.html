<!-- edcat_root/pages/templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <title>{{ _('Login') }} - {{ _('EDCAT') }}</title>
</head><body>
    <div class="container relative flex flex-col justify-between h-full max-w-6xl px-10 mx-auto xl:px-0 mt-5">
        {% include 'header.html' %}

        <div class="flex flex-col items-center pt-12">
            <h3 class="text-2xl font-bold leading-tight text-gray-900">{{ _('Restricted Area Access') }}</h3>
            <p class="mb-6 text-gray-600">{{ _('Please enter your credentials.') }}</p>
            
            <div class="w-full max-w-md">
                <form id="login-form" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                            {{ _('Email') }}
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" type="email" placeholder="email@example.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                            {{ _('Password') }}
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="******************">
                    </div>
                    <div class="flex items-center justify-between">
                        <button id="login-button" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button">
                            {{ _('Sign In') }}
                        </button>
                    </div>
                </form>
                <p id="login-error" class="text-red-500 text-xs italic text-center"></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {{ firebase_config | tojson }};
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const loginButton = document.getElementById('login-button');
        const emailField = document.getElementById('email');
        const passwordField = document.getElementById('password');
        const errorField = document.getElementById('login-error');

        loginButton.addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailField.value;
            const password = passwordField.value;
            
            errorField.textContent = '';

            auth.signInWithEmailAndPassword(email, password)
                .then(userCredential => userCredential.user.getIdToken())
                .then(idToken => {
                    const langCode = "{{ g.lang_code or 'pt_BR' }}";
                    return fetch(`/${langCode}/session_login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: idToken })
                    });
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to set session cookie.');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        // Simple, hardcoded redirect as per the original, correct logic.
                        const langCode = "{{ g.lang_code or 'pt_BR' }}";
                        window.location.href = `/${langCode}/admin_home`;
                    } else {
                        throw new Error(data.message || 'Backend error during login.');
                    }
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    errorField.textContent = '{{ _("Invalid credentials or login error.") }}';
                });
        });
    </script>
</body>
</html>
