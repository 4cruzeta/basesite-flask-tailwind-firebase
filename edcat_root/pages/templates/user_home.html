<!DOCTYPE html>
<html lang="{{ g.lang_code or 'pt_BR' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <title>{{ _('User Home') }} - {{ _('EDCAT') }}</title>
</head>
<body class="bg-gray-100">
    <div class="container relative flex flex-col justify-between h-full max-w-6xl px-10 mx-auto xl:px-0 mt-5">
        {% include 'header.html' %}

        <div class="w-full mx-auto mt-12 mb-16">
            <div class="flex flex-col items-center justify-center mb-12">
                <h2 class="text-3xl font-bold leading-tight text-gray-900">{{ _('User Home') }}</h2>
                <p class="text-gray-600">
                    {{ _('Welcome,') }} <b class="font-semibold">{{ g.user_profile.full_name or g.user.email }}</b>.
                </p>
            </div>

            <!-- Links Section -->
            <div class="bg-white p-8 rounded-xl shadow-md mb-10">
                <h3 class="text-xl font-semibold text-gray-800 border-b pb-3 mb-6">{{ _('Available Pages') }}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Example Link -->
                    <div class="bg-gray-50 p-4 rounded-lg flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-800">{{ _('My Profile') }}</p>
                            <p class="text-sm text-gray-600">{{ _('View and edit your profile information.') }}</p>
                        </div>
                        <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-900">{{ _('Go') }}</a>
                    </div>
                    <!-- More links can be added here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
