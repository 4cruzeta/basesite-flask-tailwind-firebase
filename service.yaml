apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: edcat-container
  labels:
    cloud.googleapis.com/location: us-east4
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 468.0.0
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/edcat-site/edcat-container@sha256:00dbfb7c2fd421865edad3200596ba8e824bbc709907b77d60ebcef1c3219251
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "edcat-site"
